name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # El SDK del hub se empaqueta desde su repo en cada ejecución (feed local packages/vortex-sdk).
  HUB_REPO: https://github.com/ArcGabito/vortex-api
  HUB_REF: main

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: SDK del hub
        run: |
          git clone --depth 1 --branch "$HUB_REF" "$HUB_REPO" "$RUNNER_TEMP/vortex-api"
          VORTEX_API_DIR="$RUNNER_TEMP/vortex-api" scripts/pack-sdk.sh

      - name: Test
        run: dotnet test tests/VortexWms.Core.Tests --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  app:
    name: App (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: SDK del hub
        shell: bash
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch "$HUB_REF" "$HUB_REPO" "$RUNNER_TEMP/vortex-api"
          VORTEX_API_DIR="$RUNNER_TEMP/vortex-api" scripts/pack-sdk.sh

      - name: Workloads de MAUI
        run: dotnet workload restore src/VortexWms/VortexWms.csproj

      - name: Build
        run: dotnet build src/VortexWms/VortexWms.csproj --configuration Release -f net10.0-windows10.0.19041.0 -warnaserror
